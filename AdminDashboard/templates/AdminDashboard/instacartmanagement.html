{% extends "AdminDashboard/base.html" %}
{% load static %}

{% block content %}
<div class="container mt-5">
    <div class="card shadow-sm rounded-4 border-0">
        <div class="card-body">
            <h2 class="mb-4 text-center text-primary fw-bold">
                Extracted Ingredients List
            </h2>

            {% if objects %}
                <div class="list-group">
                    {% for item in objects %}
                        <a href="{% url 'instacart_ingredients_details' item.user.id %}"
                           class="list-group-item list-group-item-action d-flex justify-content-between align-items-center border-0 mb-2 shadow-sm rounded-3">
                            <div>
                                <i class="bi bi-person-circle me-2 text-primary"></i>
                                <span class="fw-semibold">{{ item.user.username }}</span>
                            </div>
                            <i class="bi bi-chevron-right text-muted"></i>
                        </a>
                    {% endfor %}
                </div>
            {% else %}
                <div class="alert alert-info text-center mt-4">
                    <i class="bi bi-exclamation-circle me-2"></i>
                    No ingredients found.
                </div>
            {% endif %}
        </div>
    </div>
</div>
{% endblock %}
