{% extends "AdminDashboard/base.html" %}
<!DOCTYPE html>
<html>

<head>
  <title>Cuokka Admin Dashboard</title>
</head>

<body>
  <h1>Welcome to Custom Admin Dashboard</h1>
  <a href="{% url 'admin_logout' %}">Logout</a>

  <h3>Users</h3>
  <ul>
    {% for user in users %}
    <li>{{ user.username }} - {{ user.email }} - Superuser: {{ user.is_superuser }}</li>
    {% endfor %}
  </ul>
</body>

</html>
