{% extends "AdminDashboard/base.html" %}
{% block content %}
<div class="content-wrapper mx-3">
  <section class="content-header"><h1>Delete Subscription</h1></section>
  <section class="content">
    <p>Are you sure you want to delete <strong>{{ subscription.name }}</strong>?</p>
    <form method="post">
      {% csrf_token %}
      <button type="submit" class="btn btn-danger">Yes, Delete</button>
      <a href="{% url 'subscription_list' %}" class="btn btn-secondary">Cancel</a>
    </form>
  </section>
</div>
{% endblock %}
