<!doctype html>
{% load static %}
<html lang="en">

<head>
  <meta charset="utf-8" />
  <title>Cuokka Admin | Login Page</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Fonts -->
  <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/@fontsource/source-sans-3@5.0.12/index.css"
    crossorigin="anonymous" media="print" onload="this.media='all'" />

  <!-- Bootstrap Icons -->
  <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    crossorigin="anonymous" />

  <!-- OverlayScrollbars -->
  <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/overlayscrollbars@2.11.0/styles/overlayscrollbars.min.css"
    crossorigin="anonymous" />

  <!-- AdminLTE CSS -->
  <link rel="stylesheet" href="{% static 'dist/css/adminlte.css' %}">

  <!-- ✅ Fix Input Icon Alignment and Center Button -->
  <style>
    /* Keep icons vertically aligned */
    .input-group .form-control,
    .input-group .input-group-text {
      height: 45px;
      display: flex;
      align-items: center;
    }

    /* Prevent shifting when required validation triggers */
    input:invalid {
      box-shadow: none !important;
      outline: none !important;
    }

    /* Focus effect */
    .form-control:focus {
      box-shadow: 0 0 0 0.15rem rgba(13, 110, 253, 0.25);
    }

    /* Center login box vertically */
    body.login-page {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .login-box {
      width: 360px;
    }

    .login-logo a {
      display: block;
      padding: 15px;
      font-weight: 700;
      font-size: 1.3rem;
      text-align: center;
    }

    /* Center login button */
    .login-btn {
      display: flex;
      justify-content: center;
      margin-top: 15px;
    }

    .login-btn button {
      width: 60%;
      font-weight: 600;
    }

    /* Responsive fix */
    @media (max-width: 400px) {
      .login-btn button {
        width: 100%;
      }
    }
  </style>
</head>

<body class="login-page bg-body-secondary">
  <div class="login-box">
    <div class="login-logo bg-primary rounded-top">
      <a href="#"><b class="text-white">Cuokka Administration</b></a>
    </div>

    <div class="card">
      <div class="card-body login-card-body">

        <!-- ✅ Django login form -->
        <form method="post" action="{% url 'admin_login' %}">
          {% csrf_token %}

          <!-- Email -->
          <div class="input-group mb-3">
            <span class="input-group-text"><i class="bi bi-envelope"></i></span>
            <input type="email" name="email" class="form-control" placeholder="Email" required />
          </div>

          <!-- Password -->
          <div class="input-group mb-3">
            <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
            <input type="password" name="password" class="form-control" placeholder="Password" required />
          </div>

          <!-- ✅ Centered Login Button -->
          <div class="login-btn">
            <button type="submit" class="btn btn-primary">Sign In</button>
          </div>
        </form>

        {% if messages %}
        <div class="mt-3">
          {% for message in messages %}
          <div class="alert alert-danger text-center">{{ message }}</div>
          {% endfor %}
        </div>
        {% endif %}
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script
    src="https://cdn.jsdelivr.net/npm/overlayscrollbars@2.11.0/browser/overlayscrollbars.browser.es6.min.js"
    crossorigin="anonymous"></script>
  <script
    src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
    crossorigin="anonymous"></script>
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.min.js"
    crossorigin="anonymous"></script>

  <!-- AdminLTE JS -->
  <script src="{% static 'dist/js/adminlte.js' %}"></script>
</body>

</html>
