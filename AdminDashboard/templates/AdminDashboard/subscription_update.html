{% extends "AdminDashboard/base.html" %}
{% block content %}

<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
      <div class="card shadow-lg border-0 rounded-4">

        <!-- Header -->
        <div class="card-header bg-primary text-white text-center rounded-top-4 py-3">
          <h5 class="mb-0 fw-semibold">✏️ Edit Subscription</h5>
        </div>

        <!-- Body -->
        <div class="card-body bg-light p-4 rounded-bottom-4">
          <form method="post" novalidate autocomplete="off">
            {% csrf_token %}

            <!-- Plan Name -->
            <div class="mb-3">
              <label class="form-label fw-semibold">Plan Name</label>
              <input 
                type="text" 
                class="form-control" 
                id="name" 
                name="name" 
                value="{{ subscription.name }}" 
                placeholder="Enter plan name" 
                required>
            </div>

            <!-- Price -->
            <div class="mb-3">
              <label class="form-label fw-semibold">Price</label>
              <input 
                type="number" 
                step="0.01" 
                class="form-control" 
                id="price" 
                name="price" 
                value="{{ subscription.price }}" 
                placeholder="Enter price" 
                required>
            </div>

            <!-- Duration -->
            <div class="mb-3">
              <label class="form-label fw-semibold">Duration (Days)</label>
              <input 
                type="number" 
                class="form-control" 
                id="duration" 
                name="duration" 
                value="{{ subscription.duration }}" 
                placeholder="Enter duration (e.g., 30)" 
                required>
              <small class="text-muted">Example: 7 for a week, 30 for a month</small>
            </div>

            <!-- Plan Type -->
            <div class="mb-3">
              <label class="form-label fw-semibold">Plan Type</label>
              <select 
                class="form-control" 
                id="plan_type" 
                name="plan_type" 
                required>
                <option value="">-- Select Plan Type --</option>
                <option value="Trial" {% if subscription.plan_type == 'Trial' %}selected{% endif %}>Trial</option>
                <option value="Weekly" {% if subscription.plan_type == 'Weekly' %}selected{% endif %}>Weekly</option>
                <option value="Monthly" {% if subscription.plan_type == 'Monthly' %}selected{% endif %}>Monthly</option>
                <option value="Annually" {% if subscription.plan_type == 'Annually' %}selected{% endif %}>Annually</option>
              </select>
            </div>

            <!-- Description -->
            <div class="mb-3">
              <label class="form-label fw-semibold">Description</label>
              <textarea 
                class="form-control" 
                id="description" 
                name="description" 
                rows="3" 
                placeholder="Write short description...">{{ subscription.description }}</textarea>
            </div>

            <!-- Buttons -->
            <div class="d-flex justify-content-between mt-4">
              <a href="{% url 'subscription_list' %}" class="btn btn-outline-secondary px-4">
                ⬅ Cancel
              </a>
              <button type="submit" class="btn btn-success px-4">
                💾 Update
              </button>
            </div>

          </form>
        </div>

      </div>
    </div>
  </div>
</div>

<!-- Optional Inline Styling for extra polish -->
<style>
  .form-control {
    border-radius: 10px;
    height: 42px;
  }
  textarea.form-control {
    height: auto;
  }
  .form-control:focus {
    border-color: #0d6efd;
    box-shadow: 0 0 0 0.15rem rgba(13, 110, 253, 0.15);
  }
  .btn {
    border-radius: 8px;
    font-weight: 500;
  }
  .card {
    transition: transform 0.2s ease, box-shadow 0.3s ease;
  }
  .card:hover {
    transform: translateY(-4px);
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
  }
</style>

{% endblock %}
